<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070b15" media="(prefers-color-scheme: dark)">
  <title>whether weather — 출사·나들이 전국 웨더맵</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="whether weather">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:wght@400..700&family=Gowun+Batang:wght@400;700&display=swap">
  <!-- ?v= 값은 배포할 때 커밋 번호로 바뀐다. 파일이 바뀌면 브라우저가 예전 캐시 대신 새 파일을 받게 하기 위함 -->
  <link rel="stylesheet" href="css/style.css?v=__VERSION__">
</head>
<body>
  <header class="top">
    <button id="menu" class="icon-btn" type="button" aria-label="메뉴 열기" aria-controls="side" aria-expanded="false">☰</button>
    <img class="logo" src="logo.svg" width="32" height="32" alt="">
    <h1>whether weather</h1>
    <p class="sub">출사와 나들이를 위한 전국 시·군·구 시간별 예보 지도</p>
    <button id="labels-toggle" class="chip" type="button" aria-pressed="false" title="지도에 지역 이름 표시">지명</button>
  </header>

  <main class="layout">
    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="card side" id="side" aria-label="설정과 상세 정보">
      <div class="side-head">
        <h2>메뉴</h2>
        <button id="close" class="icon-btn" type="button" aria-label="메뉴 닫기">✕</button>
      </div>
      <section>
        <h3>출사 지수</h3>
        <div class="chips" id="score-chips"></div>
        <p class="note" id="layer-note"></p>
      </section>
      <section>
        <h3>날씨</h3>
        <div class="chips" id="weather-chips"></div>
      </section>
      <section id="ranking-section">
        <h3>이 시각 추천 지역</h3>
        <ol class="ranking" id="ranking"></ol>
      </section>
      <section id="detail">
        <p class="note">지도에서 지역을 선택하면 시간별 예보가 표시됩니다.</p>
      </section>
      <p class="note" id="meta"></p>
      <p class="note">정기 갱신 02·05·08·11·14·17·20·23시 발표 후 약 20분 (늦어질 수 있음)</p>
      <p class="note">날씨: 기상청 단기예보 · 행정구역 경계: 통계청 통계지리정보서비스(2018, 공공누리 제1유형)</p>
    </aside>
    <section class="card map-card">
      <div class="map-wrap">
        <svg id="map" role="img" aria-label="전국 시군구 지도"></svg>
        <div class="legend" id="legend"></div>
        <button class="banner" id="banner" type="button" hidden></button>
        <button class="map-reset" id="map-reset" type="button" aria-label="지도 원래 크기로" title="지도 원래 크기로" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="picked" id="picked" type="button" hidden></button>
        <div class="tooltip" id="tooltip" hidden></div>
      </div>
      <div class="timeline">
        <div class="timeline-head">
          <output id="hour-label" for="hour"></output>
          <button class="step-btn" id="hour-now" type="button" title="현재 시각으로">지금</button>
        </div>
        <div class="timeline-row">
          <button class="step-btn" id="hour-prev" type="button" aria-label="1시간 전">−1h</button>
          <input id="hour" type="range" step="1" aria-label="시각">
          <button class="step-btn" id="hour-next" type="button" aria-label="1시간 후">+1h</button>
        </div>
      </div>
    </section>

  </main>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/suncalc.js"></script>
  <script src="js/scores.js?v=__VERSION__"></script>
  <script src="js/app.js?v=__VERSION__"></script>
  <script>
    // 홈 화면에 설치(PWA)할 수 있게 하고, 오프라인일 때 마지막으로 본 화면을 보여주는 서비스 워커
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
